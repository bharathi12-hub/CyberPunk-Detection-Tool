name: CI

on:
  push:
    branches: [main, 'refactor/**', 'fix/**', 'feature/**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Engine tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dev tooling
        run: npm ci
      - name: Run engine unit tests
        run: npm test
      - name: Lint backend + tests
        run: npm run lint

  backend:
    name: Backend install check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
